# Risk model parameters. Any change here is a new version and must pass `riskwatch eval`.
var:
  method: historical        # historical | age_weighted
  lookback_days: 500
  age_decay: 0.99           # used only by age_weighted
ewma_lambda: 0.94
ewma_window: 250
beta_window: 250
factors: [MktRF, SMB, HML]
stress:                     # hypothetical instantaneous sleeve shocks
