  energy_collapse: {NoDur: -0.02, Durbl: -0.05, Manuf: -0.08, Enrgy: -0.45, HiTec: -0.03, Telcm: -0.02, Shops: -0.02, Hlth: -0.01, Utils: -0.03, Other: -0.06}
  tech_derating:   {NoDur: 0.01, Durbl: -0.08, Manuf: -0.06, Enrgy: 0.00, HiTec: -0.35, Telcm: -0.12, Shops: -0.10, Hlth: -0.04, Utils: 0.02, Other: -0.05}
  rates_shock:     {NoDur: -0.05, Durbl: -0.12, Manuf: -0.08, Enrgy: -0.04, HiTec: -0.14, Telcm: -0.08, Shops: -0.08, Hlth: -0.06, Utils: -0.15, Other: 0.02}
